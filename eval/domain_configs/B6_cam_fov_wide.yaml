# B6_cam_fov_wide.yaml
# Increase FOV -> wider view, smaller objects, more barrel distortion
name: cam_fov_wide
levels:
  weak:
    camera:
      shifts:
        - name: "agentview"
          fovy_offset: 5.0
  medium:
    camera:
      shifts:
        - name: "agentview"
          fovy_offset: 15.0
  strong:
    camera:
      shifts:
        - name: "agentview"
          fovy_offset: 22.0